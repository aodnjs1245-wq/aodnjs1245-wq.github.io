        /* YYYY.MM -> YYYYMM */
        function toSortKey(workDate) {
            const m = String(workDate || "").match(/^(\d{4})\.(\d{1,2})/);
            if (!m) return null;

            const y = Number(m[1]);
            const mo = Number(m[2]);
            if (!y || !mo) return null;

            return y * 100 + mo;
        }

        /* XSS 최소 방지 */
        function escapeHtml(str) {
            return String(str ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        /* 미리보기 */
        function renderPreview() {
            document.getElementById("rowCount").textContent = rows.length;

            document.getElementById("previewBody").innerHTML = rows.map(row => `
                <tr style="border-bottom:1px solid #e5e7eb;">
                    <td style="padding:12px; text-align:center;">${escapeHtml(row.work_date)}</td>
                    <td style="padding:12px; text-align:left;">${escapeHtml(row.work_title)}</td>
                    <td style="padding:12px; text-align:center;">${escapeHtml(row.client)}</td>
                </tr>
            `).join("");
        }

        /* Firestore 일괄 등록 */
        async function importRows() {
            const ok = confirm(`${rows.length}건을 performance_all에 등록할까요? 중복 등록 여부를 먼저 확인해주세요.`);
            if (!ok) return;

            const btn = document.getElementById("btnImport");
            const msg = document.getElementById("resultMsg");

            btn.disabled = true;
            msg.textContent = "등록 중입니다. 창을 닫지 마세요.";

            try {
                const batch = writeBatch(db);

                rows.forEach(row => {
                    const ref = doc(collection(db, "performance_all"));
                    const sortKey = toSortKey(row.work_date);

                    const payload = {
                        work_date: String(row.work_date || "").trim(),
                        work_title: String(row.work_title || "").trim(),
                        client: String(row.client || "").trim(),
                        created_at: serverTimestamp()
                    };

                    if (sortKey) payload.sort_key = sortKey;

                    batch.set(ref, payload);
                });

                await batch.commit();

                alert("일괄 등록 완료");
                location.href = "/06_admin/05_performance_manage.html";
            } catch (error) {
                console.error(error);
                alert("등록 실패: " + error.message);
                msg.textContent = "등록에 실패했습니다. 콘솔을 확인해주세요.";
                btn.disabled = false;
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            onAuthStateChanged(auth, (user) => {
                if (!user) {
                    location.href = "/06_admin/01_admin_login.html";
                    return;
                }

                renderPreview();
                document.getElementById("btnImport").addEventListener("click", importRows);
            });
        });

<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/assets/images/00_common/logo_top.svg" type="image/svg+xml">
    <title>서환산업 | 자료실 목록 관리</title>

    <link rel="stylesheet" href="/css/01_common.css">
    <link rel="stylesheet" href="/css/02_pages.css">
    <link rel="stylesheet" href="/css/03_admin.css">
</head>

<body>

    <main class="admin-wrap">
        <section class="admin-card">

            <div class="admin-card__head">
                <h1 class="admin-card__title">자료실 관리</h1>
                <p class="admin-card__desc">자료 수정/삭제는 관리자만 가능합니다.</p>
            </div>

            <div class="admin-card__body">

                <div class="admin-actions" style="justify-content:flex-end;">
                    <a class="admin-btn admin-btn--ghost" href="/06_admin/03_admin_home.html">관리자 홈</a>
                    <a class="admin-btn admin-btn--primary" href="/06_admin/07_admin_library.html">새 자료 등록</a>
                </div>

                <!-- 수정 패널 -->
                <div class="admin-panel" id="editPanel" style="display:none; margin-top:14px;">
                    <h2 class="admin-panel__title">자료 수정</h2>

                    <form id="editForm" style="margin-top:12px;">
                        <input type="hidden" id="editId">

                        <div class="admin-field">
                            <label class="admin-label" for="editTitle">제목</label>
                            <input class="admin-input" id="editTitle" type="text">
                        </div>

                        <div class="admin-field">
                            <label class="admin-label" for="editContent">내용</label>
                            <textarea class="admin-textarea" id="editContent"></textarea>
                        </div>

                        <p class="admin-note" style="margin-top:8px;">
                            파일 교체는 다음 단계에서 추가합니다. (현재는 제목/내용 수정)
                        </p>

                        <div class="admin-actions" style="justify-content:flex-end;">
                            <button class="admin-btn admin-btn--ghost" type="button" id="btnCancelEdit">취소</button>
                            <button class="admin-btn admin-btn--primary" type="submit">수정 저장</button>
                        </div>
                    </form>
                </div>

                <!-- 목록 -->
                <div class="admin-panel" style="margin-top:14px;">
                    <h2 class="admin-panel__title">자료 목록</h2>
                    <p class="admin-panel__text">삭제/수정 후 홈페이지 자료실에 자동 반영됩니다.</p>

                    <div id="libraryAdminList" style="margin-top:12px;"></div>
                </div>

                <p class="admin-note">삭제는 되돌릴 수 없습니다.</p>

            </div>
        </section>
    </main>

    <script type="module" src="/js/01_firebase.js"></script>

    <script type="module">
        /* =========================
           자료실 목록 관리
        ========================= */
        import { auth, db, storage } from "/js/01_firebase.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
        import {
            collection,
            query,
            orderBy,
            getDocs,
            doc,
            getDoc,
            updateDoc,
            deleteDoc
        } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";
        import {
            ref,
            deleteObject
        } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-storage.js";

        function formatDate(value) {
            const d = value?.toDate ? value.toDate() : new Date(value);
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, "0");
            const day = String(d.getDate()).padStart(2, "0");
            return `${y}-${m}-${day}`;
        }

        function escapeHtml(str) {
            return String(str ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function openEdit(row) {
            document.getElementById("editPanel").style.display = "block";
            document.getElementById("editId").value = row.id;
            document.getElementById("editTitle").value = row.title || "";
            document.getElementById("editContent").value = row.content || "";
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function closeEdit() {
            document.getElementById("editPanel").style.display = "none";
            document.getElementById("editId").value = "";
            document.getElementById("editTitle").value = "";
            document.getElementById("editContent").value = "";
        }

        async function loadLibrary() {
            const wrap = document.getElementById("libraryAdminList");

            try {
                const q = query(
                    collection(db, "library_items"),
                    orderBy("created_at", "desc")
                );

                const snap = await getDocs(q);

                if (snap.empty) {
                    wrap.innerHTML = `<div class="admin-panel__text">등록된 자료가 없습니다.</div>`;
                    return;
                }

                const rows = snap.docs.map((d) => ({
                    id: d.id,
                    ...d.data()
                }));

                wrap.innerHTML = rows.map(row => `
                <div class="lib-row">
                    <div class="lib-main">
                        <div class="lib-title">${escapeHtml(row.title)}</div>

                        <div class="lib-meta">
                            작성일: ${formatDate(row.created_at)} · ID: ${row.id}
                        </div>

                        <div class="lib-snippet">
                            ${escapeHtml(String(row.content || "").slice(0, 120)).replaceAll("\n", "<br>")}
                            ${String(row.content || "").length > 120 ? "..." : ""}
                        </div>

                        <div class="lib-file">
                            첨부:
                            ${row.file_url
                        ? `<a href="${row.file_url}" target="_blank" rel="noopener" class="lib-filelink">${escapeHtml(row.file_name || "첨부파일")}</a>`
                        : "없음"
                    }
                        </div>
                    </div>

                    <div class="lib-actions">
                        <a class="admin-btn admin-btn--ghost" href="/05_notice/06_library_view.html?id=${row.id}" target="_blank" rel="noopener">보기</a>
                        <button class="admin-btn admin-btn--ghost" data-action="edit" data-id="${row.id}" type="button">수정</button>
                        <button class="admin-btn admin-btn--danger" data-action="delete" data-id="${row.id}" type="button">삭제</button>
                    </div>
                </div>
            `).join("");
            } catch (error) {
                console.error(error);
                wrap.innerHTML = `<div class="admin-panel__text">목록을 불러오지 못했습니다.</div>`;
            }
        }

        async function deleteStorageFile(filePath) {
            if (!filePath) return;

            try {
                await deleteObject(ref(storage, filePath));
            } catch (error) {
                console.warn("DB는 삭제됐지만 파일 삭제 실패:", error);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            onAuthStateChanged(auth, async (user) => {
                if (!user) {
                    location.href = "/06_admin/01_admin_login.html";
                    return;
                }

                await loadLibrary();

                document.getElementById("btnCancelEdit").addEventListener("click", closeEdit);

                document.getElementById("editForm").addEventListener("submit", async (e) => {
                    e.preventDefault();

                    const id = document.getElementById("editId").value;
                    const title = document.getElementById("editTitle").value.trim();
                    const content = document.getElementById("editContent").value.trim();

                    if (!id || !title) {
                        alert("제목은 필수입니다.");
                        return;
                    }

                    try {
                        await updateDoc(doc(db, "library_items", id), {
                            title,
                            content: content || null
                        });

                        alert("수정 완료");
                        closeEdit();
                        await loadLibrary();
                    } catch (error) {
                        console.error(error);
                        alert("수정 실패: " + error.message);
                    }
                });

                document.getElementById("libraryAdminList").addEventListener("click", async (e) => {
                    const btn = e.target.closest("button[data-action]");
                    if (!btn) return;

                    const action = btn.dataset.action;
                    const id = btn.dataset.id;

                    if (action === "edit") {
                        const snap = await getDoc(doc(db, "library_items", id));

                        if (!snap.exists()) {
                            alert("수정 데이터를 불러오지 못했습니다.");
                            return;
                        }

                        openEdit({
                            id: snap.id,
                            ...snap.data()
                        });

                        return;
                    }

                    if (action === "delete") {
                        const yes = confirm("정말 삭제할까요? 삭제하면 되돌릴 수 없습니다.");
                        if (!yes) return;

                        try {
                            const snap = await getDoc(doc(db, "library_items", id));
                            const row = snap.exists() ? snap.data() : null;

                            await deleteDoc(doc(db, "library_items", id));

                            if (row?.file_path) {
                                await deleteStorageFile(row.file_path);
                            }

                            alert("삭제 완료");
                            closeEdit();
                            await loadLibrary();
                        } catch (error) {
                            console.error(error);
                            alert("삭제 실패: " + error.message);
                        }
                    }
                });
            });
        });
    </script>

</body>

</html>
